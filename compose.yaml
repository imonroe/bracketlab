# Single-container deployment (PRD section 9).
#
#   docker compose up --build
#
# Then open http://127.0.0.1:3000. The port binds to loopback only: for remote access,
# put an authenticated TLS reverse proxy in front. Anonymous public exposure is
# unsupported.
services:
  bracketlab:
    build: .
    image: bracketlab
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bracketlab-data:/data
    environment:
      # Camera models to accept, as ExifTool reports them. "*" accepts any (untested) model.
      BRACKETLAB_SUPPORTED_MODELS: ILCE-6100
    # Treat RAW decoders as an untrusted-file attack surface (PRD section 10).
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Proposed envelope; benchmark before relying on it (PRD section 9).
    cpus: 4
    mem_limit: 8g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bracketlab-data:
